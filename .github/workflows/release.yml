name: Release

# Standard Obsidian community-plugin release pattern: pushing a tag that
# matches the manifest.json version builds the plugin and attaches
# main.js, manifest.json, and styles.css to a GitHub Release. Obsidian's
# plugin browser downloads those three files directly from the release,
# not from the repo — so they're intentionally gitignored elsewhere and
# only ever produced here.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check and run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.js
            manifest.json
            styles.css
